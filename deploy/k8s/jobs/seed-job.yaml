# One-off Job that populates the database with demo data.
# Not part of kustomization.yaml on purpose: it runs only when you ask for it.
#   kubectl -n ledger delete job seed --ignore-not-found
#   kubectl apply -f deploy/k8s/jobs/seed-job.yaml
#   kubectl -n ledger logs -f job/seed
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: ledger
spec:
  backoffLimit: 0 # do not retry automatically: a failed seed should be inspected
  ttlSecondsAfterFinished: 3600 # cleaned up after 1 hour
  template:
    metadata:
      labels:
        app: seed
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: go-payments-ledger:dev
          imagePullPolicy: IfNotPresent
          command: ["/seed"]
          args: ["-accounts=20", "-usd-accounts=3", "-transfers=150"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
